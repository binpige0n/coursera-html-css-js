<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Displaying Images</title>
  <style>
  .grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-gap: 10px;
  }

  .grid img {
    width: 100%;
    height: auto;
  }

  p {
    color: #8D4D3A;
    font-size: 20px;
    text-align: center;
  }

  h1 {
    color: #35110E;
    font-size: 36px;
    text-align: center;
  }
  </style>
</head>
<body style="background-color: #EFE5D3;">
  <h1>Art is Freedom.</h1>
  <img src="https://images.unsplash.com/photo-1699976104973-899c4415a0d1?q=80&w=1172&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" width="1000" height="500" alt="Picture with a quote"> <br>
  <p>&quot;Now is no time to think of what you do not have.<br>
  Think of what you can do with that there is.&quot;</p>
  <br>
  <!-- Images in a Grid -->
  <img src="https://images.unsplash.com/photo-1702165637265-7d16fbd2e0de?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" width="400" height="400">
  <img src="https://images.unsplash.com/photo-1701743802478-83a7cefa3bb5?q=80&w=1025&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" width="400" height="400">
  <img src="https://images.unsplash.com/photo-1699390948033-f2b269fbfda5?q=80&w=1935&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" width="400" height="400">

</body>
</html>
